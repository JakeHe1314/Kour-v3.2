<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kour社 | 联系我们</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #13161d;
            --glass: rgba(20, 22, 30, 0.85);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text: #f0f0f5;
            --text-muted: #8b8fa3;
            --accent: #ff3c38;
            --accent-glow: rgba(255, 60, 56, 0.5);
            --radius: 18px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }
        .section {
            padding: 60px 0;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .contact-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            transition: 0.3s;
        }
        .contact-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
        }
        .contact-icon {
            font-size: 40px;
            margin-bottom: 16px;
        }
        .contact-card h3 {
            margin: 0 0 12px;
            font-size: 20px;
            color: var(--text);
        }
        .contact-card p {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }
        .contact-link {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }
        .contact-link:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
            color: #fff;
        }
        footer {
            padding: 30px 0 40px;
            border-top: 1px solid var(--glass-border);
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 24px;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <section id="contact" class="section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-card">
                    <div class="contact-icon">🤝</div>
                    <h3>站长</h3>
                    <p>站长主页，欢迎交流和合作。</p>
                    <a href="https://space.bilibili.com/1768253735" class="contact-link" target="_blank" rel="noopener">访问主页 →</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="#contact">联系我们</a>
                <a href="https://space.bilibili.com/1768253735" target="_blank" rel="noopener">站长</a>
            </div>
        </div>
    </footer>
</body>
</html>
