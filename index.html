<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kour社 | 联系我们</title>
    <style>
        :root {
            --bg-1: #060a13;
            --bg-2: #0d1728;
            --bg-3: #111827;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-strong: rgba(17, 24, 39, 0.92);
            --panel-soft: rgba(148, 163, 184, 0.08);
            --border: rgba(148, 163, 184, 0.2);
            --text: #edf2ff;
            --text-muted: #a7b3c9;
            --gold: #f4c86b;
            --gold-strong: #d9a441;
            --accent: #8b5cf6;
            --accent-2: #5eead4;
            --accent-3: #60a5fa;
            --shadow: rgba(0, 0, 0, 0.42);
            --radius: 22px;
            --radius-sm: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            color: var(--text);
            line-height: 1.7;
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.30), transparent 18%),
                radial-gradient(circle at 80% 10%, rgba(96, 165, 250, 0.20), transparent 20%),
                radial-gradient(circle at 65% 80%, rgba(94, 234, 212, 0.18), transparent 22%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 30%, var(--bg-3) 100%);
            position: relative;
            overflow-x: hidden;
            letter-spacing: 0.02em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
            position: relative;
            z-index: 1;
        }

        .section {
            padding: 72px 0 40px;
            position: relative;
            z-index: 1;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
            max-width: 900px;
            margin: 0 auto;
        }

        .contact-card {
            position: relative;
            background: linear-gradient(180deg, rgba(15,23,42,0.78), rgba(15,23,42,0.94));
            border: 1px solid rgba(244, 200, 107, 0.28);
            border-radius: var(--radius);
            padding: 36px 28px;
            text-align: center;
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255,255,255,0.08);
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .contact-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(244, 200, 107, 0.75), rgba(96, 165, 250, 0.35), rgba(139, 92, 246, 0.45));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .contact-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 26px 52px rgba(0, 0, 0, 0.5);
            border-color: rgba(244, 200, 107, 0.52);
        }

        .contact-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 34px;
            background: linear-gradient(135deg, rgba(244, 200, 107, 0.18), rgba(96, 165, 250, 0.18));
            border: 1px solid rgba(244, 200, 107, 0.28);
            box-shadow: inset 0 0 22px rgba(244, 200, 107, 0.12);
        }

        .contact-card h3 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 2vw, 2.15rem);
            color: var(--text);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .contact-card p {
            margin: 0 0 22px;
            color: var(--text-muted);
            font-size: 0.96rem;
            line-height: 1.8;
        }

        .contact-link {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(244, 200, 107, 0.18), rgba(139, 92, 246, 0.18));
            border: 1px solid rgba(244, 200, 107, 0.32);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.96rem;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(244, 200, 107, 0.08);
        }

        .contact-link:hover {
            background: linear-gradient(135deg, rgba(244, 200, 107, 0.25), rgba(139, 92, 246, 0.28));
            border-color: rgba(244, 200, 107, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(139, 92, 246, 0.18);
        }

        footer {
            padding: 20px 0 36px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.92rem;
            position: relative;
            z-index: 1;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 22px;
            margin-bottom: 14px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--gold);
        }

        @media (max-width: 640px) {
            .section {
                padding-top: 56px;
            }

            .contact-card {
                padding: 28px 22px;
            }

            .contact-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <section id="contact" class="section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-card">
                    <div class="contact-icon">🤝</div>
                    <h3>站长</h3>
                    <p>站长主页，欢迎交流和合作。</p>
                    <a href="https://space.bilibili.com/1768253735" class="contact-link" target="_blank" rel="noopener">访问主页 →</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="#contact">联系我们</a>
                <a href="https://space.bilibili.com/1768253735" target="_blank" rel="noopener">站长</a>
            </div>
        </div>
    </footer>
</body>
</html>
